name: Verify GITHUB Secret

on:
  push:
    branches:
      - '**'

jobs:
  check-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Check if GITHUB secret is set
        run: |
          if [ -z "${{ secrets.GITHUB }}" ]; then
            echo "GITHUB secret is NOT set!"
            exit 1
          else
            echo "GITHUB secret is set!"
          fi 